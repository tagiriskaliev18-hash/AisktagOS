name: Сборка AIsktagOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - '**'
      - '.github/workflows/build-iso.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

concurrency:
  group: aisktagos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрая статическая проверка (1–2 минуты) идёт параллельно со сборкой и не блокирует её
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Скрипты оболочки (shellcheck)
        run: |
          shellcheck -S warning build.sh scripts/*.sh overlay/usr/lib/aisktagos/*.sh             overlay/usr/lib/aisktagos/ai/aisktag-llm-run overlay/usr/lib/aisktagos/ai/aisktag-llm-wait             overlay/usr/bin/aisktag-install tools/jarvis-update.sh tools/release/make-jarvis-update.sh
      - name: Python и дизайн-токены
        run: |
          python3 -m py_compile overlay/usr/lib/aisktagos/*.py overlay/usr/lib/aisktagos/ai/aisktag-ai-model             overlay/usr/bin/ai overlay/usr/bin/aisktag-new overlay/usr/bin/aisktag-doctor overlay/usr/bin/jarvis
          python3 tools/test-jarvis.py
          python3 tools/test-fallback.py
          python3 assets/tokens.py --check
      - name: Каталог моделей, раскладка Plasma, правила polkit
        run: |
          python3 -c "import json; d = json.load(open('overlay/usr/share/aisktagos/ai/models.json')); assert d['models']"
          node --check overlay/usr/share/plasma/look-and-feel/org.aisktagos.desktop/contents/layouts/org.kde.plasma.desktop-layout.js
          python3 -c "import xml.dom.minidom as m; m.parse('overlay/usr/share/polkit-1/actions/org.aisktagos.ai.policy')"

  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt

      - name: Инструменты сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap squashfs-tools xorriso grub-pc-bin \
               grub-efi-amd64-bin mtools dosfstools

      - name: Сборка ISO
        run: sudo WORK_DIR=/mnt/aisktagos-work OUT_DIR="$GITHUB_WORKSPACE/out" ./build.sh

      - name: Подготовка файлов к публикации
        id: files
        run: |
          cd out
          sudo chown -R "$(id -u):$(id -g)" .
          iso="$(ls *.iso)"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          # GitHub Releases принимает файлы до 2 ГБ — большой образ режется на части
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$iso" "$iso.part"
            rm "$iso"
            parts="$(ls "$iso".part* | tr '\n' ' ')"
            # Скрипт для Windows: проверяет, что скачаны все части, склеивает и сверяет SHA-256
            sed -e "s/@ISO@/$iso/" -e "s/@PARTS@/$(ls "$iso".part* | wc -l)/" -e 's/\r$//' -e 's/$/\r/' \
                "$GITHUB_WORKSPACE/tools/release/join-windows.bat" > join-windows.bat
            printf '#!/bin/sh\ncat %s> %s && sha256sum -c %s.sha256\n' "$parts" "$iso" "$iso" > join-linux.sh
            chmod +x join-linux.sh
          fi
          # Обновление Джарвиса без переустановки ОС (jarvis --update, tools/jarvis-update.sh)
          "$GITHUB_WORKSPACE/tools/release/make-jarvis-update.sh" .
          ls -la

      - name: Артефакт сборки (для PR и проверки)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aisktagos-iso
          path: out/*
          retention-days: 3
          compression-level: 0

      - name: Параметры релиза
        id: rel
        if: github.event_name != 'pull_request'
        run: |
          . ./config.env
          echo "tag=${OS_ID}-${OS_VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=${OS_NAME} ${OS_VERSION} «${OS_CODENAME}» — сборка ${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Публикация в GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          files: out/*
          # Сборки из веток разработки — предварительные: они не подменяют «последний» релиз main
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
