# AIsktagOS: NetworkManager сам находит и подключает любую сеть — проводную,
# Wi-Fi, USB-модем — и для проводной сразу создаёт подключение с DHCP.
# Этот файл без настроек перекрывает одноимённый файл в /usr/lib/NetworkManager/conf.d/,
# где в Ubuntu все устройства, кроме Wi-Fi и модемов, «неуправляемые».
# Обычно это снимает netplan (/etc/netplan/01-network-manager-all.yaml), но если
# его генератор не сработает (live-сессия, перенос системы), проводная сеть
# оставалась бы выключенной.
