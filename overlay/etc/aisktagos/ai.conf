# Настройки встроенного ИИ AIsktag Mind. Формат KEY=VALUE.
# Изменения применяются при следующем запуске модели (она стартует по первому запросу
# и выключается после 15 минут простоя; принудительно: sudo systemctl restart aisktag-llm-backend).

# Какая модель: id из /usr/share/aisktagos/ai/models.json (lite, standard, pro) или полный путь к .gguf.
# Меняется командой `ai model use <id>` или в Центре AIsktagOS → «ИИ».
AI_MODEL=lite

# Движок: auto (Vulkan на настоящей видеокарте AMD/Intel/NVIDIA, иначе процессор), cpu, vulkan.
AI_BACKEND=auto

# Длина контекста в токенах (auto — по модели и свободной памяти) и число потоков процессора (auto — физические ядра).
AI_CTX=auto
AI_THREADS=auto

# Дополнительные ключи llama-server (для опытных), например: AI_EXTRA_ARGS=--flash-attn on
AI_EXTRA_ARGS=
