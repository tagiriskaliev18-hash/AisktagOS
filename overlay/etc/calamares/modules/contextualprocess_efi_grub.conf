---
# На UEFI поставить метапакет grub-efi-amd64 до grub-install.
# firmwareType=bios сюда не попадает. "*" — EFI и любая другая не-BIOS прошивка.
# Модули и подписанные shim/grub уже в образе; скрипт не требует сеть.
dontChroot: false
timeout: 600
firmwareType:
    bios: "-/bin/true"
    "*":
        - command: "/usr/lib/aisktagos/install-efi-grub.sh"
          timeout: 600
