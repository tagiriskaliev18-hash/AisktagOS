---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
requirements:
    requiredStorage: 25
    requiredRam:     2.0
    # Calamares считает интернет доступным, только если ответ НЕ пустой.
    # connectivity-check.ubuntu.com отвечает «204 No Content» без тела, и мастер
    # всегда писал «Система не подключена к Интернету». Эти адреса возвращают текст.
    internetCheckUrl:
        - http://networkcheck.kde.org
        - http://nmcheck.gnome.org/check_network_status.txt
        - http://detectportal.firefox.com/success.txt
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root
geoip:
    style:    "xml"
    url:      "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
