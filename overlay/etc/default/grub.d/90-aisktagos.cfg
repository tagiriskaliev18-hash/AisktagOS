# Загрузчик установленной AIsktagOS
GRUB_DISTRIBUTOR="AIsktagOS"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
# Без «quiet splash»: при загрузке видно, какие службы запускаются, а не чёрный экран.
# Ядро выводит только ошибки (loglevel=3), systemd — строки [  OK  ] по каждой службе.
GRUB_CMDLINE_LINUX_DEFAULT="loglevel=3 systemd.show_status=true"
# Показывать Windows и другие системы в меню (двойная загрузка)
GRUB_DISABLE_OS_PROBER=false
GRUB_GFXMODE=auto
