# Шумоподавление микрофона для голосового ввода Mind.
# Встроенный в PipeWire модуль WebRTC: отдельный пакет не нужен (noise-suppression-for-voice
# в Ubuntu 24.04 отсутствует). nofail — если модуля нет, звук продолжит работать без фильтра.
# В настройках звука появится источник «AIsktag Voice (шумоподавление)».
context.modules = [
{   name = libpipewire-module-echo-cancel
    flags = [ nofail ]
    args = {
        library.name = aec/libspa-aec-webrtc
        node.description = "AIsktag Voice (шумоподавление)"
        aec.args = {
            webrtc.noise_suppression = true
            webrtc.gain_control = true
            webrtc.extended_filter = false
            webrtc.high_pass_filter = true
        }
        capture.props = { node.name = "capture.aisktag_voice" node.passive = true }
        source.props  = { node.name = "aisktag_voice_source" node.description = "AIsktag Voice (шумоподавление)" }
        sink.props    = { node.name = "aisktag_voice_sink" node.passive = true }
        playback.props = { node.name = "playback.aisktag_voice" node.passive = true }
    }
}
]
