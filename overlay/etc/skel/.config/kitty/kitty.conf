# Терминал AIsktagOS (kitty, отрисовка на GPU)
font_family      JetBrains Mono
font_size        11.0
disable_ligatures never
cursor_shape     beam
cursor_blink_interval 0.6
scrollback_lines 20000
enable_audio_bell no
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 1
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
background_opacity 0.94
background_blur 1
shell zsh
copy_on_select clipboard

# Цвета: палитра Aurora (assets/tokens.py)
foreground #e4e9ff
background #070b16
selection_foreground #ffffff
selection_background #1e2a50
cursor #22e4ff
url_color #3d7bff
color0  #111a33
color8  #4b5578
color1  #ff5f57
color9  #ff7b74
color2  #2fd27a
color10 #5be37a
color3  #febc2e
color11 #ffd166
color4  #5b8cff
color12 #8aa9ff
color5  #a78bfa
color13 #c4b5fd
color6  #22e4ff
color14 #67f0ff
color7  #b8c2e0
color15 #ffffff
active_tab_background #2a5be0
active_tab_foreground #ffffff
inactive_tab_background #111a33
inactive_tab_foreground #8f9abf

# Интеграция с оболочкой и ИИ Mind: kitty видит границы команд (нужно для `ai why` и Ctrl+Shift+E)
shell_integration enabled
allow_remote_control yes

# Сочетания (привычные из VS Code и Windows Terminal)
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
# Ctrl+Shift+E: Mind объясняет вывод последней команды в плавающем окне поверх терминала
map ctrl+shift+e launch --type=overlay --stdin-source=@last_cmd_output sh -c 'ai "Объясни этот вывод команды и, если это ошибка, предложи исправление"; printf "\n[Enter — закрыть] "; read _ </dev/tty'
