# AIsktagOS: настройки ядра под разработку.

# Наблюдатели за файлами: VS Code, JetBrains, webpack/vite, cargo watch. Стандартных 8192 мало («ENOSPC: System limit for number of file watchers reached»).
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.inotify.max_queued_events = 65536

# Много открытых файлов (базы данных, контейнеры, сборка больших проектов)
fs.file-max = 2097152

# Элементы Elasticsearch/OpenSearch, IDE и игр требуют большого числа отображений памяти
vm.max_map_count = 1048576

# Очереди соединений для локальных серверов разработки
net.core.somaxconn = 4096

# Своп только в zram (сжатая память): активно им пользоваться дёшево
vm.swappiness = 100
vm.page-cluster = 0
